name: CI
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JS syntax check (frontend + Functions + Worker)
        run: |
          node --check site/assets/app.js
          node --check worker.js
          find functions -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Security-invariant tests (grading, authz, cert, token)
        run: |
          npm ci
          npm test

      - name: Validate course catalogue (structure + no-shrink guard)
        run: python3 scripts/validate.py

      - name: Draft validator JS/Python parity (studio fast-feedback rules)
        # functions/api/_draft-validate.js gives studio authors fast feedback before
        # the real gate (scripts/validate.py against the merged catalogue). Both the
        # JS test above (npm test, via test/draft-validator-fixtures.test.ts) and this
        # Python mirror run the same fixtures in test/fixtures/draft-validation/ —
        # this step fails if the Python side's verdicts ever drift from the JS side's.
        run: python3 scripts/check_draft_validator_parity.py

      - name: Assert public catalogue ships no quiz answers
        # The browser-served catalogue must never contain quiz[].answer, or a learner
        # can read the key and mint a real certificate without knowing the material.
        run: python3 scripts/build_public_data.py --check

      - name: Server quiz keys match the catalogue (no hand-forged grading)
        # Under auto-merge with no human gate, _quiz-keys.js could be edited directly
        # to change grades/certs. Regenerate it from courses.json and require a match.
        run: |
          python3 scripts/build_quiz_keys.py
          git diff --exit-code functions/api/_quiz-keys.js \
            || { echo "::error::functions/api/_quiz-keys.js does not match courses.json — regenerate with scripts/build_quiz_keys.py"; exit 1; }

      - name: Institute quiz keys match the imported lessons
        # Same discipline as _quiz-keys.js above: the Institute's server-only
        # answer keys are generated from the committed lesson data — regenerate
        # and require a match so a key can't be hand-edited to change a grade.
        run: |
          cd web && npm ci --silent && node scripts/build-institute-quiz-keys.mjs
          cd .. && git diff --exit-code functions/api/_institute-quiz-keys.js \
            || { echo "::error::functions/api/_institute-quiz-keys.js does not match web/src/data/institute/imported — regenerate with web/scripts/build-institute-quiz-keys.mjs"; exit 1; }

      - name: Content coverage report (CLAUDE.md authoring constraints)
        run: python3 scripts/content_lint.py

      - name: Build frontend (Astro build gate)
        run: |
          cd web
          npm ci
          npm run build

      - name: Dependency audit (fail on high/critical)
        run: cd web && npm audit --audit-level=high

      - name: No emoji as UI glyphs (DESIGN.md iconography law)
        # Emoji render differently per-OS and read as templated. The UI uses one
        # inline-SVG line-icon set (web/src/lib/icons.ts + components/Icon.astro).
        run: node scripts/check-no-emoji.mjs
