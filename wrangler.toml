name = "sikhiuni"
account_id = "751487ee9fad43101841aa2b6aa2c449"
main = "worker.js"
compatibility_date = "2026-06-14"

# Repointed 2026-09-03: moved from a third-party account (Jasvant Dosanjh's
# -- 0d4412e40181808b16cce0225ddb5152, see the `upstream` remote) to the
# Contact@sikhism.io account that also runs sikhi.io and punjabiuni. The
# live Worker here is ALREADY deployed and actively serving real users
# (confirmed via real signups through the day before this repoint) -- this
# file is being brought into agreement with what's already live, verified
# directly against the Cloudflare API, not assumed.
#
# sikh-university.com (+www) are ALSO bound as custom domains to this same
# Worker on this account, added outside this file (API/dashboard, not
# `wrangler deploy`'s routes management) -- deliberately not listed here,
# so a deploy from this file never touches or removes them.
routes = [
  { pattern = "sikhiuni.com", custom_domain = true },
  { pattern = "www.sikhiuni.com", custom_domain = true }
]

# Build the Astro frontend (web/) before deploying; its output is the static site.
[build]
command = "cd web && npm install && npm run build && rm -f dist/assets/data/courses.json"

# Astro build output (web/dist) is served by the assets binding; the Worker handles /api/*.
[assets]
directory = "./web/dist"
binding = "ASSETS"
# /technology/* routes through the Worker first so it can augment the asset
# layer's own (hash-hardened) CSP for the code lab — 'wasm-unsafe-eval' + the
# Pyodide CDN in script-src/connect-src, and frame-src 'self' for the sandboxed
# preview iframe. Everything else the site forbids stays forbidden. Every other
# path is still served straight from the edge (Worker skipped). The legacy
# /institute prefix stays in the list so the Worker runs to 301 it to
# /technology (the wing was renamed 2026-08).
# HTML runs Worker first so LEGACY_HOSTS 301 to sikhiuni.com (same pattern as sikhi.io).
# Immutable static stays asset-first for LCP.
run_worker_first = [
  "/*",
  "!/_astro/*",
  "!/assets/*",
  "!/media/*",
  "!/fonts/*",
  "!/scripts/*",
  "!/favicon.ico",
  "!/robots.txt",
]

[[d1_databases]]
binding = "DB"
database_name = "sikh-university"
# Real, live, already-populated database on the new account -- 30 real
# users / 18 real sessions confirmed present before this file was touched.
# NEVER re-seed or wipe this. schema.sql + all 8 migrations already applied
# in full (verified column-by-column), except `push_subs` (see migrations/
# 0009_push_subs.sql, added alongside this repoint).
database_id = "b8300881-b5de-4136-a6fd-00fe9cc2ce02"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "sikh-university-media"

# Workers AI — powers /api/translate (site-UI machine translation; courses stay English).
[ai]
binding = "AI"

# Translation cache: <lang>:<sha256(text)> -> translated string. Real KV
# namespace on the new account (matches what's already live -- confirmed
# via the API, not the stale id this file used to carry).
[[kv_namespaces]]
binding = "TRANSLATIONS"
id = "32b7aaabd0414d7e9bbe07c3db63ab49"

# Non-secret vars. SITE_URL is intentionally omitted so magic-link URLs derive
# from the request origin (works on workers.dev and any custom domain).
[vars]
# sikhiuni.com is verified in the (new) Resend account this project now
# shares with sikhi.io/punjabiuni -- dosanjhlabs.com is NOT, so sending
# from it was silently 502-ing every magic-link request (confirmed live,
# 2026-09-03: RESEND_API_KEY wasn't even SET on the live Worker at all,
# meaning sign-in was fully broken before this repoint, not just misrouted).
MAIL_FROM = "Sikhi University <login@sikhiuni.com>"
# ADMIN_EMAILS and RESEND_API_KEY are Worker secrets (encrypted) — kept out
# of source. env.ADMIN_EMAILS reads the same whether it's a var or a secret.

# Daily coursework-reminder push sweep (16:00 UTC). No-op until the VAPID
# secrets exist (see docs/DEPLOY.md → "Web Push reminders").
[triggers]
crons = ["0 16 * * *"]

# Workers Logs: persist console output (errors, magic-link/verify/translate failures)
# so production problems are observable after the fact. Without this, console lines
# only exist during a live `wrangler tail` and otherwise evaporate.
[observability]
enabled = true
head_sampling_rate = 1

# Rate limiting is enforced per-IP in worker.js via an atomic D1 counter (RATE_LIMITS +
# checkRateLimit). The Cloudflare experimental `ratelimit` unsafe-binding was removed
# because it silently failed open in testing (never blocked). Limits stay generous (the
# mission serves camps and gurdwaras behind shared NATs) and the limiter fails open on error.

# Family credential verification: source accounts are queried, never copied.

[[d1_databases]]
binding = "FAMILY_SIKHI_DB"
database_name = "sikhi-accounts"
database_id = "e198e71f-a7d5-4d11-b22f-6fec5ec2be29"

[[d1_databases]]
binding = "FAMILY_PUNJABI_DB"
database_name = "punjabiuni-db"
database_id = "420d6e84-6e84-482b-981a-7482cd316375"
